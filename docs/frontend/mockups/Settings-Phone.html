<body>


<link rel="preconnect" href="https://fonts.googleapis.com">

<div data-theme="light" style="width: 390px; height: 844px; overflow: hidden; position: relative; background: var(--bg); color: var(--ink); font-family: var(--font-sans); box-sizing: border-box; display: flex; flex-direction: column"><header class="ol-topbar" style="position: relative"><a class="ol-icon-btn" href="#" aria-label="Back"><svg class="ol-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></a><h1 class="ol-topbar__title">Settings</h1></header><main style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column"><div style="padding: 16px 16px 96px; display: flex; flex-direction: column; gap: 14px; overflow: hidden"><section class="ol-card" style="padding: 20px; gap: 16px; flex-shrink: 0"><h2 class="h3" style="margin: 0">Display</h2><div class="cell" style="display: flex; flex-direction: column; gap: 8px"><span class="ol-field__label">Theme</span><div class="ol-segmented" role="radiogroup" aria-label="Theme" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); width: 100%"><button class="ol-segmented__opt" role="radio" style="justify-content: center; padding: 0 8px" aria-checked="false"><svg class="ol-icon ol-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Light</button><button class="ol-segmented__opt" role="radio" style="justify-content: center; padding: 0 8px" aria-checked="false"><svg class="ol-icon ol-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>Dark</button><button class="ol-segmented__opt" role="radio" style="justify-content: center; padding: 0 8px" aria-checked="true"><svg class="ol-icon ol-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>System</button></div></div><div style="display: flex; flex-direction: column; gap: 8px"><span class="ol-field__label">Display scale</span><div class="ol-segmented" role="radiogroup" aria-label="Display scale" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); width: 100%"><button class="ol-segmented__opt" role="radio" style="justify-content: center; padding: 0 8px" aria-checked="false">90%</button><button class="ol-segmented__opt" role="radio" style="justify-content: center; padding: 0 8px" aria-checked="true">100%</button><button class="ol-segmented__opt" role="radio" style="justify-content: center; padding: 0 8px" aria-checked="false">125%</button><button class="ol-segmented__opt" role="radio" style="justify-content: center; padding: 0 8px" aria-checked="false">150%</button></div><span class="ol-field__help">Scales text, buttons and spacing. Works together with your browser zoom.</span></div><label class="ol-switch"><input type="checkbox" role="switch">Reduce motion</label></section><section class="ol-card" style="padding: 20px 20px 24px; gap: 8px; flex-shrink: 0"><h2 class="h3" style="margin: 0 0 4px">Reminders</h2><label class="ol-switch"><input type="checkbox" role="switch" checked>Starter feeding reminders</label><label class="ol-switch"><input type="checkbox" role="switch" checked>Stage reminders during a batch</label><label class="ol-switch"><input type="checkbox" role="switch">Also send by e-mail</label><div class="ol-field" style="margin-top: 8px"><label class="ol-field__label" for="rmlight">Remind before kneading</label><div class="ol-field__control"><select id="rmlight" class="ol-select"><option>60 minutes</option><option>30 minutes</option></select></div></div></section></div></main><nav class="ol-nav ol-nav--bottom" aria-label="Main" style="position: absolute"><a class="ol-nav__item" href="#" aria-current="page"><svg class="ol-icon ol-icon--lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span class="ol-nav__label">Home</span></a><a class="ol-nav__item" href="#"><svg class="ol-icon ol-icon--lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5V4.5A1.5 1.5 0 0 1 5.5 3H20v15H5.5A1.5 1.5 0 0 0 4 19.5zm0 0A1.5 1.5 0 0 0 5.5 21H20v-3"/><path d="M8 7h8M8 11h5"/></svg><span class="ol-nav__label">Recipes</span></a><a class="ol-nav__item" href="#"><svg class="ol-icon ol-icon--lg" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M8 14h3M8 17h6"/></svg><span class="ol-nav__label">Batches</span></a><a class="ol-nav__item" href="#"><svg class="ol-icon ol-icon--lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8v3H8z"/><path d="M7 6h10l1 3v10a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V9z"/><path d="M6 12h12M10 15.5h.01M13.5 17h.01M14 14.5h.01"/></svg><span class="ol-nav__label">Starters</span></a><a class="ol-nav__item" href="#"><svg class="ol-icon ol-icon--lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.4A8 8 0 1 1 21 12z"/><path d="m12 8.5.9 2.6 2.6.9-2.6.9-.9 2.6-.9-2.6-2.6-.9 2.6-.9z"/></svg><span class="ol-nav__label">Assistant</span></a></nav></div>
