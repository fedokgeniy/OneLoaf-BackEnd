<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kitchen & cost settings — Phone · dark</title>
<link rel="stylesheet" href="../design-system/tokens.css">
<link rel="stylesheet" href="../design-system/components.css">
</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:var(--primary)}a:hover{color:var(--primary-strong)}
</style>

<div data-theme="dark" style="width: 390px; height: 844px; overflow: hidden; position: relative; background: var(--bg); color: var(--ink); font-family: var(--font-sans); box-sizing: border-box; display: flex; flex-direction: column"><header class="ol-topbar" style="position: relative"><a class="ol-icon-btn" href="#" aria-label="Back"><svg class="ol-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a><h1 class="ol-topbar__title">Kitchen &amp; costs</h1></header><main style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column"><div style="padding: 16px 16px 150px; display: flex; flex-direction: column; gap: 14px; overflow: hidden"><section class="ol-card" style="padding: 20px; gap: 14px; flex-shrink: 0"><h2 class="h3" style="margin: 0">Oven</h2><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px"><div class="ol-field" style="min-width: 0"><label class="ol-field__label" for="oppdark">Power</label><div class="ol-field__control"><input id="oppdark" class="ol-input ol-input--suffixed ol-num" type="text" value="2.5" inputmode="decimal"><span class="ol-field__suffix">kW</span></div></div><div class="ol-field" style="min-width: 0"><label class="ol-field__label" for="ocpdark">Capacity</label><div class="ol-field__control"><input id="ocpdark" class="ol-input ol-input--suffixed ol-num" type="text" value="3" inputmode="decimal"><span class="ol-field__suffix">loaves</span></div></div><div class="ol-field" style="min-width: 0"><label class="ol-field__label" for="ohpdark">Preheat</label><div class="ol-field__control"><input id="ohpdark" class="ol-input ol-input--suffixed ol-num" type="text" value="45" inputmode="decimal"><span class="ol-field__suffix">min</span></div></div><div class="ol-field" style="min-width: 0"><label class="ol-field__label" for="otpdark">Bake temp.</label><div class="ol-field__control"><input id="otpdark" class="ol-input ol-input--suffixed ol-num" type="text" value="230" inputmode="decimal"><span class="ol-field__suffix">°C</span></div></div></div></section><section class="ol-card" style="padding: 20px; gap: 14px; flex-shrink: 0"><h2 class="h3" style="margin: 0">Cost</h2><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px"><div class="ol-field" style="min-width: 0"><label class="ol-field__label" for="ctpdark">Electricity tariff</label><div class="ol-field__control"><input id="ctpdark" class="ol-input ol-input--suffixed ol-num" type="text" value="0.25" inputmode="decimal"><span class="ol-field__suffix">EUR/kWh</span></div></div><div class="ol-field" style="min-width: 0"><label class="ol-field__label" for="cppdark">Packaging</label><div class="ol-field__control"><input id="cppdark" class="ol-input ol-input--suffixed ol-num" type="text" value="0.15" inputmode="decimal"><span class="ol-field__suffix">per loaf</span></div></div><div class="ol-field" style="min-width: 0"><label class="ol-field__label" for="clpdark">Loss rate</label><div class="ol-field__control"><input id="clpdark" class="ol-input ol-input--suffixed ol-num" type="text" value="10" inputmode="decimal"><span class="ol-field__suffix">%</span></div></div><div class="ol-field" style="min-width: 0; grid-column: 1 / -1"><label class="ol-field__label" for="crpdark" style="white-space: nowrap">Labor rate (optional)</label><div class="ol-field__control"><input id="crpdark" class="ol-input ol-input--suffixed ol-num" type="text" placeholder="12.00" inputmode="decimal"><span class="ol-field__suffix">EUR/h</span></div></div></div><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px"><div class="ol-field" style="min-width: 0"><label class="ol-field__label" for="ccpdark">Currency</label><div class="ol-field__control"><select id="ccpdark" class="ol-select"><option>EUR</option><option>USD</option></select></div></div><div class="ol-field" style="min-width: 0"><label class="ol-field__label" for="czpdark">Time zone</label><div class="ol-field__control"><select id="czpdark" class="ol-select"><option>Europe/Vilnius</option><option>Europe/Berlin</option></select></div></div></div></section></div><div style="position: absolute; left: 0; right: 0; bottom: 64px; padding: 12px 16px; background: var(--bg); border-top: 1px solid var(--border-hairline); display: flex; gap: 8px"><button class="ol-btn ol-btn--primary ol-btn--lg ol-btn--block">Save kitchen settings</button></div></main><nav class="ol-nav ol-nav--bottom" aria-label="Main" style="position: absolute"><a class="ol-nav__item" href="#" aria-current="page"><svg class="ol-icon ol-icon--lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg><span class="ol-nav__label">Home</span></a><a class="ol-nav__item" href="#"><svg class="ol-icon ol-icon--lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5V4.5A1.5 1.5 0 0 1 5.5 3H20v15H5.5A1.5 1.5 0 0 0 4 19.5zm0 0A1.5 1.5 0 0 0 5.5 21H20v-3"></path><path d="M8 7h8M8 11h5"></path></svg><span class="ol-nav__label">Recipes</span></a><a class="ol-nav__item" href="#"><svg class="ol-icon ol-icon--lg" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4M8 14h3M8 17h6"></path></svg><span class="ol-nav__label">Batches</span></a><a class="ol-nav__item" href="#"><svg class="ol-icon ol-icon--lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8v3H8z"></path><path d="M7 6h10l1 3v10a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V9z"></path><path d="M6 12h12M10 15.5h.01M13.5 17h.01M14 14.5h.01"></path></svg><span class="ol-nav__label">Starters</span></a><a class="ol-nav__item" href="#"><svg class="ol-icon ol-icon--lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.4A8 8 0 1 1 21 12z"></path><path d="m12 8.5.9 2.6 2.6.9-2.6.9-.9 2.6-.9-2.6-2.6-.9 2.6-.9z"></path></svg><span class="ol-nav__label">Assistant</span></a></nav></div>


</body>
