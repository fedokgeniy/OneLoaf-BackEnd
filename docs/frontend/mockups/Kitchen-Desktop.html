><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px"><div class="ol-field" style="min-width: 0"><label class="ol-field__label" for="opdlight">Power</label><div class="ol-field__control"><input id="opdlight" class="ol-input ol-input--suffixed ol-num" type="text" value="2.5" inputmode="decimal"><span class="ol-field__suffix">kW</span></div></div><div class="ol-field" style="min-width: 0"><label class="ol-field__label" for="ocdlight">Capacity</label><div class="ol-field__control"><input id="ocdlight" class="ol-input ol-input--suffixed ol-num" type="text" value="3" inputmode="decimal"><span class="ol-field__suffix">loaves</span></div></div><div class="ol-field" style="min-width: 0"><label class="ol-field__label" for="ohdlight">Preheat</label><div class="ol-field__control"><input id="ohdlight" class="ol-input ol-input--suffixed ol-num" type="text" value="45" inputmode="decimal"><span class="ol-field__suffix">min</span></div></div><div class="ol-field" style="min-width: 0"><label class="ol-field__label" for="otdlight">Bake temp.</label><div class="ol-field__control"><input id="otdlight" class="ol-input ol-input--suffixed ol-num" type="text" value="230" inputmode="decimal"><span class="ol-field__suffix">°C</span></div></div></div></section><section class="ol-card" style="padding: 20px; gap: 14px; flex-shrink: 0"><h2 class="h3" style="margin: 0">Mixer</h2><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px"><div class="ol-field" style="min-width: 0"><label class="ol-field__label" for="mbdlight">Bowl capacity</label><div class="ol-field__control"><input id="mbdlight" class="ol-input ol-input--suffixed ol-num" type="text" value="4" inputmode="decimal"><span class="ol-field__suffix">kg</span></div><span class="ol-field__help">Used for kneading cycles</span></div><div class="ol-field" style="min-width: 0"><label class="ol-field__label" for="mkdlight">Kneading</label><div class="ol-field__control"><input id="mkdlight" class="ol-input ol-input--suffixed ol-num" type="text" value="12" inputmode="decimal"><span class="ol-field__suffix">min</span></div></div></div></section></div><div style="display: flex; flex-direction: column; gap: 24px"><section class="ol-card" style="padding: 20px; gap: 14px; flex-shrink: 0"><h2 class="h3" style="margin: 0">Cost</h2><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px"><div class="ol-field" style="min-width: 0"><label class="ol-field__label" for="ctdlight">Electricity tariff</label><div class="ol-field__control"><input id="ctdlight" class="ol-input ol-input--suffixed ol-num" type="text" value="0.25" inputmode="decimal"><span class="ol-field__suffix">EUR/kWh</span></div></div><div class="ol-field" style="min-width: 0"><label class="ol-field__label" for="cpdlight">Packaging</label><div class="ol-field__control"><input id="cpdlight" class="ol-input ol-input--suffixed ol-num" type="text" value="0.15" inputmode="decimal"><span class="ol-field__suffix">per loaf</span></div></div><div class="ol-field" style="min-width: 0"><label class="ol-field__label" for="cldlight">Loss rate</label><div class="ol-field__control"><input id="cldlight" class="ol-input ol-input--suffixed ol-num" type="text" value="10" inputmode="decimal"><span class="ol-field__suffix">%</span></div></div><div class="ol-field" style="min-width: 0; grid-column: 1 / -1"><label class="ol-field__label" for="crdlight" style="white-space: nowrap">Labor rate (optional)</label><div class="ol-field__control"><input id="crdlight" class="ol-input ol-input--suffixed ol-num" type="text" placeholder="12.00" inputmode="decimal"><span class="ol-field__suffix">EUR/h</span></div></div></div><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px"><div class="ol-field" style="min-width: 0"><label class="ol-field__label" for="ccdlight">Currency</label><div class="ol-field__control"><select id="ccdlight" class="ol-select"><option>EUR</option><option>USD</option></select></div></div><div class="ol-field" style="min-width: 0"><label class="ol-field__label" for="czdlight">Time zone</label><div class="ol-field__control"><select id="czdlight" class="ol-select"><option>Europe/Vilnius</option><option>Europe/Berlin</option></select></div></div></div></section><div class="ol-alert ol-alert--info" role="status"><svg class="ol-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg><div class="ol-alert__body">These values are used for the electricity, packaging, loss and labor lines of every cost calculation.</div></div></div></div></div></main></div></div>
