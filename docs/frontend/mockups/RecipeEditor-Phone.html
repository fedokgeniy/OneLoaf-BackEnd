<div data-theme="light" style="width: 390px; height: 844px; overflow: hidden; position: relative; background: var(--bg); color: var(--ink); font-family: var(--font-sans); box-sizing: border-box; display: flex; flex-direction: column"><header class="ol-topbar" style="position: relative"><a class="ol-icon-btn" href="#" aria-label="Back"><svg class="ol-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></a><h1 class="ol-topbar__title">Edit recipe</h1></header><main style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column"><div style="padding: 16px 16px 150px; display: flex; flex-direction: column; gap: 12px; overflow: hidden"><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px"><div class="ol-field" style="min-width: 0; grid-column: 1 / -1"><label class="ol-field__label" for="rtplight">Title</label><div class="ol-field__control"><input id="rtplight" class="ol-input" type="text" value="White homemade loaf"></div></div><div class="ol-field" style="min-width: 0"><label class="ol-field__label" for="ryplight">Yield</label><div class="ol-field__control"><input id="ryplight" class="ol-input ol-input--suffixed ol-num" type="text" value="1" inputmode="decimal"><span class="ol-field__suffix">loaves</span></div></div><div class="ol-field" style="min-width: 0"><label class="ol-field__label" for="rwplight">Dough per loaf</label><div class="ol-field__control"><input id="rwplight" class="ol-input ol-input--suffixed ol-num" type="text" value="1 136" inputmode="decimal"><span class="ol-field__suffix">g</span></div></div><div class="ol-field" style="min-width: 0"><label class="ol-field__label" for="rsplight">Starter</label><div class="ol-field__control"><select id="rsplight" class="ol-select"><option>Mother rye</option><option>Wheat levain</option></select></div></div></div><div class="ol-card__overline">Ingredients · per loaf</div><div style="display: grid; grid-template-columns: minmax(0, 1fr) 96px 44px; gap: 8px; align-items: center"><label class="ol-visually-hidden" for="inplight0">Ingredient 1</label><input id="inplight0" class="ol-input" value="Wheat flour"><div class="ol-field__control"><label class="ol-visually-hidden" for="iaplight0">Amount</label><input id="iaplight0" class="ol-input ol-input--suffixed ol-num" value="500" inputmode="decimal" style="padding-right: 2rem"><span class="ol-field__suffix" style="right: 10px">g</span></div><button class="ol-icon-btn ol-icon-btn--danger" aria-label="Remove Wheat flour"><svg class="ol-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13M9 7V4h6v3"/></svg></button></div><div style="display: grid; grid-template-columns: minmax(0, 1fr) 96px 44px; gap: 8px; align-items: center"><label class="ol-visually-hidden" for="inplight1">Ingredient 2</label><input id="inplight1" class="ol-input" value="Rye flour"><div class="ol-field__control"><label class="ol-visually-hidden" for="iaplight1">Amount</label><input id="iaplight1" class="ol-input ol-input--suffixed ol-num" value="100" inputmode="decimal" style="padding-right: 2rem"><span class="ol-field__suffix" style="right: 10px">g</span></div><button class="ol-icon-btn ol-icon-btn--danger" aria-label="Remove Rye flour"><svg class="ol-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13M9 7V4h6v3"/></svg></button></div><div style="display: grid; grid-template-columns: minmax(0, 1fr) 96px 44px; gap: 8px; align-items: center"><label class="ol-visually-hidden" for="inplight2">Ingredient 3</label><input id="inplight2" class="ol-input" value="Water"><div class="ol-field__control"><label class="ol-visually-hidden" for="iaplight2">Amount</label><input id="iaplight2" class="ol-input ol-input--suffixed ol-num" value="375" inputmode="decimal" style="padding-right: 2rem"><span class="ol-field__suffix" style="right: 10px">g</span></div><button class="ol-icon-btn ol-icon-btn--danger" aria-label="Remove Water"><svg class="ol-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13M9 7V4h6v3"/></svg></button></div><div style="display: grid; grid-template-columns: minmax(0, 1fr) 96px 44px; gap: 8px; align-items: center"><label class="ol-visually-hidden" for="inplight3">Ingredient 4</label><input id="inplight3" class="ol-input" value="Salt"><div class="ol-field__control"><label class="ol-visually-hidden" for="iaplight3">Amount</label><input id="iaplight3" class="ol-input ol-input--suffixed ol-num" value="11" inputmode="decimal" style="padding-right: 2rem"><span class="ol-field__suffix" style="right: 10px">g</span></div><button class="ol-icon-btn ol-icon-btn--danger" aria-label="Remove Salt"><svg class="ol-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13M9 7V4h6v3"/></svg></button></div><div style="display: grid; grid-template-columns: minmax(0, 1fr) 96px 44px; gap: 8px; align-items: center"><label class="ol-visually-hidden" for="inplight4">Ingredient 5</label><input id="inplight4" class="ol-input" value="Starter"><div class="ol-field__control"><label class="ol-visually-hidden" for="iaplight4">Amount</label><input id="iaplight4" class="ol-input ol-input--suffixed ol-num" value="100" inputmode="decimal" style="padding-right: 2rem"><span class="ol-field__suffix" style="right: 10px">g</span></div><button class="ol-icon-btn ol-icon-btn--danger" aria-label="Remove Starter"><svg class="ol-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13M9 7V4h6v3"/></svg></button></div><button class="ol-btn ol-btn--ghost" style="align-self: flex-start"><svg class="ol-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add ingredient</button></div><div style="position: absolute; left: 0; right: 0; bottom: 64px; padding: 12px 16px; background: var(--bg); border-top: 1px solid var(--border-hairline); display: flex; gap: 8px"><button class="ol-btn ol-btn--secondary ol-btn--lg" style="flex: 1">Cancel</button><button class="ol-btn ol-btn--primary ol-btn--lg" style="flex: 2">Save recipe</button></div></main><nav class="ol-nav ol-nav--bottom" aria-label="Main" style="position: absolute"><a class="ol-nav__item" href="#"><svg class="ol-icon ol-icon--lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span class="ol-nav__label">Home</span></a><a class="ol-nav__item" href="#" aria-current="page"><svg class="ol-icon ol-icon--lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5V4.5A1.5 1.5 0 0 1 5.5 3H20v15H5.5A1.5 1.5 0 0 0 4 19.5zm0 0A1.5 1.5 0 0 0 5.5 21H20v-3"/><path d="M8 7h8M8 11h5"/></svg><span class="ol-nav__label">Recipes</span></a><a class="ol-nav__item" href="#"><svg class="ol-icon ol-icon--lg" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M8 14h3M8 17h6"/></svg><span class="ol-nav__label">Batches</span></a><a class="ol-nav__item" href="#"><svg class="ol-icon ol-icon--lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8v3H8z"/><path d="M7 6h10l1 3v10a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V9z"/><path d="M6 12h12M10 15.5h.01M13.5 17h.01M14 14.5h.01"/></svg><span class="ol-nav__label">Starters</span></a><a class="ol-nav__item" href="#"><svg class="ol-icon ol-icon--lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.4A8 8 0 1 1 21 12z"/><path d="m12 8.5.9 2.6 2.6.9-2.6.9-.9 2.6-.9-2.6-2.6-.9 2.6-.9z"/></svg><span class="ol-nav__label">Assistant</span></a></nav></div>
