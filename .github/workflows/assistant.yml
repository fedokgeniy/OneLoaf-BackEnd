name: assistant

on:
  push:
    branches: [master]
    paths:
      - "src/Services/Assistant/**"
      - "src/OneLoaf.Domain/**"
      - "src/OneLoaf.SharedKernel/**"
      - "src/OneLoaf.ServiceDefaults/**"
      - "src/OneLoaf.Infrastructure/**"
      - "tests/OneLoaf.Assistant.UnitTests/**"
      - "tests/OneLoaf.IntegrationTests/**"
      - "tests/OneLoaf.ArchitectureTests/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - ".github/workflows/assistant.yml"
      - "docs/api/reference/**"
  pull_request:
    paths:
      - "src/Services/Assistant/**"
      - "src/OneLoaf.Domain/**"
      - "src/OneLoaf.SharedKernel/**"
      - "src/OneLoaf.ServiceDefaults/**"
      - "src/OneLoaf.Infrastructure/**"
      - "tests/OneLoaf.Assistant.UnitTests/**"
      - "tests/OneLoaf.IntegrationTests/**"
      - "tests/OneLoaf.ArchitectureTests/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - ".github/workflows/assistant.yml"
      - "docs/api/reference/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assistant-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  COVERAGE_THRESHOLD: "70"

jobs:
  build-test:
    name: Build, test, coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: |
          dotnet restore OneLoaf.slnx --locked-mode
          dotnet tool restore

      - name: Build
        run: dotnet build OneLoaf.slnx --configuration Release --no-restore

      - name: Unit and architecture tests
        run: >
          dotnet test tests/OneLoaf.Assistant.UnitTests --configuration Release --no-build
          --settings coverlet.runsettings --collect:"XPlat Code Coverage"
          --results-directory TestResults --logger trx
          && dotnet test tests/OneLoaf.ArchitectureTests --configuration Release --no-build --logger trx --results-directory TestResults

      - name: Integration tests (assistant flows against the real Core API, PostgreSQL and Redis)
        run: >
          dotnet test tests/OneLoaf.IntegrationTests --configuration Release --no-build
          --filter "FullyQualifiedName~OneLoaf.IntegrationTests.Assistant"
          --settings coverlet.runsettings --collect:"XPlat Code Coverage"
          --results-directory TestResults --logger trx

      - name: Coverage gate (Assistant.Application)
        run: |
          dotnet reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:coveragereport \
            -assemblyfilters:"+OneLoaf.Assistant.Application" -reporttypes:"Cobertura;MarkdownSummaryGithub"
          cat coveragereport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          rate=$(grep -oP '<coverage line-rate="\K[0-9.]+' coveragereport/Cobertura.xml)
          python3 - "$rate" "$COVERAGE_THRESHOLD" <<'PY'
          import sys
          rate, threshold = float(sys.argv[1]) * 100, float(sys.argv[2])
          print(f"Line coverage: {rate:.1f} % (required {threshold:.0f} %)")
          sys.exit(0 if rate >= threshold else 1)
          PY

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: assistant-test-results
          path: |
            TestResults/**/*.trx
            coveragereport

  image:
    name: Image to GHCR
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/oneloaf-assistant" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: src/Services/Assistant/OneLoaf.Assistant/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha,scope=assistant
          cache-to: type=gha,scope=assistant,mode=max
