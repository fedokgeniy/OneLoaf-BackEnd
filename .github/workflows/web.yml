name: web

on:
  push:
    branches: [master]
    paths: &web-paths
      - "src/Web/**"
      - "tests/OneLoaf.Web.*/**"
      - "docs/frontend/design-system/**"
      - "docs/api/examples/**"
      - "scripts/sync-design-system.ps1"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - "web.runsettings"
      - ".editorconfig"
      - ".github/workflows/web.yml"
  pull_request:
    paths: *web-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  COVERAGE_THRESHOLD: "70"

jobs:
  build-test:
    name: Build, format, tests, coverage gate, e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Design system copies up to date
        shell: pwsh
        run: ./scripts/sync-design-system.ps1 -Check

      - name: Restore (locked)
        run: |
          dotnet restore OneLoaf.slnx --locked-mode
          dotnet tool restore

      - name: Build
        run: dotnet build OneLoaf.slnx --configuration Release --no-restore

      - name: Format (dotnet format = linter + formatter)
        run: >
          dotnet format OneLoaf.slnx --verify-no-changes --no-restore
          --include src/Web/ tests/OneLoaf.Web.UnitTests/ tests/OneLoaf.Web.E2ETests/

      - name: No inline styles in components
        run: |
          if grep -rn --include=*.razor 'style="' src/Web; then
            echo "::error::Inline style attributes found; use ol-* classes or .razor.css"
            exit 1
          fi

      - name: Unit and component tests (bUnit)
        run: >
          dotnet test tests/OneLoaf.Web.UnitTests --configuration Release --no-build
          --settings web.runsettings --collect:"XPlat Code Coverage"
          --results-directory TestResults --logger trx

      - name: Coverage report
        if: always()
        run: >
          dotnet reportgenerator
          -reports:"TestResults/**/coverage.cobertura.xml"
          -targetdir:coveragereport
          -reporttypes:"Cobertura;Html;MarkdownSummaryGithub"

      - name: Coverage gate (Shared + features)
        run: |
          cat coveragereport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          rate=$(grep -oP '<coverage line-rate="\K[0-9.]+' coveragereport/Cobertura.xml)
          python3 - "$rate" "$COVERAGE_THRESHOLD" <<'PY'
          import sys
          rate, threshold = float(sys.argv[1]) * 100, float(sys.argv[2])
          print(f"Line coverage: {rate:.1f} % (required {threshold:.0f} %)")
          sys.exit(0 if rate >= threshold else 1)
          PY

      - name: Publish
        run: dotnet publish src/Web/OneLoaf.Web/OneLoaf.Web.csproj --configuration Release --no-restore --output publish/web

      - name: Playwright browser
        run: pwsh tests/OneLoaf.Web.E2ETests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: E2E tests (Playwright, recorded API examples)
        env:
          ONELOAF_E2E_WEB_ROOT: ${{ github.workspace }}/publish/web/wwwroot
        run: >
          dotnet test tests/OneLoaf.Web.E2ETests --configuration Release --no-build
          --results-directory TestResults --logger trx

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: web-test-results
          path: |
            TestResults/**/*.trx
            tests/OneLoaf.Web.E2ETests/bin/Release/net10.0/TestResults/screenshots/*.png
            coveragereport

  image:
    name: Image to GHCR
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/oneloaf-web" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: src/Web/OneLoaf.Web/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
