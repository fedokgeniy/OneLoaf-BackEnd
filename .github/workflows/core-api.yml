name: core-api

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "tests/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "OneLoaf.slnx"
      - "global.json"
      - "dotnet-tools.json"
      - "coverlet.runsettings"
      - ".github/workflows/core-api.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "OneLoaf.slnx"
      - "global.json"
      - "dotnet-tools.json"
      - "coverlet.runsettings"
      - ".github/workflows/core-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-api-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  COVERAGE_THRESHOLD: "80"

jobs:
  build-test:
    name: Build, test, coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: |
          dotnet restore OneLoaf.slnx --locked-mode
          dotnet tool restore

      - name: Build
        run: dotnet build OneLoaf.slnx --configuration Release --no-restore

      - name: Vulnerable packages
        run: |
          dotnet list OneLoaf.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable packages found"
            exit 1
          fi

      - name: Unit, architecture and integration tests
        run: >
          dotnet test OneLoaf.slnx --configuration Release --no-build
          --settings coverlet.runsettings --collect:"XPlat Code Coverage"
          --results-directory TestResults --logger trx

      - name: Coverage report
        if: always()
        run: >
          dotnet reportgenerator
          -reports:"TestResults/**/coverage.cobertura.xml"
          -targetdir:coveragereport
          -reporttypes:"Cobertura;Html;MarkdownSummaryGithub"

      - name: Coverage gate (Domain + Application)
        run: |
          cat coveragereport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          rate=$(grep -oP '<coverage line-rate="\K[0-9.]+' coveragereport/Cobertura.xml)
          python3 - "$rate" "$COVERAGE_THRESHOLD" <<'PY'
          import sys
          rate, threshold = float(sys.argv[1]) * 100, float(sys.argv[2])
          print(f"Line coverage: {rate:.1f} % (required {threshold:.0f} %)")
          sys.exit(0 if rate >= threshold else 1)
          PY

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: |
            TestResults/**/*.trx
            coveragereport

  image:
    name: Image to GHCR
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/oneloaf-core-api" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: src/Services/CoreApi/OneLoaf.CoreApi/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha,scope=core-api
          cache-to: type=gha,scope=core-api,mode=max
