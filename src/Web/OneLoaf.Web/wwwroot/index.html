<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <!-- interactive-widget=resizes-content: the on-screen keyboard shrinks the layout viewport, so sticky bars stay
         above it (design-system-in-blazor.md §5). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="OneLoaf: recipes, costs, batches and an AI assistant for home bakers." />
    <meta name="theme-color" content="#faf7f2" />
    <title>OneLoaf</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <script>
        // Display settings before the first paint (no flash of the wrong theme). Mirrors applyDisplay in js/device.js.
        (function () {
            var prefs = {};
            try { prefs = JSON.parse(localStorage.getItem("oneloaf.display") || "{}") || {}; } catch (e) { prefs = {}; }
            var theme = prefs.theme === "light" || prefs.theme === "dark" ? prefs.theme
                : (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
            var root = document.documentElement;
            root.setAttribute("data-theme", theme);
            root.setAttribute("data-scale", [90, 100, 125, 150].indexOf(prefs.scale) >= 0 ? String(prefs.scale) : "100");
            if (prefs.reduceMotion === true) { root.setAttribute("data-motion", "reduce"); }
            var meta = document.querySelector("meta[name=theme-color]");
            if (meta) { meta.setAttribute("content", theme === "dark" ? "#1a0f06" : "#faf7f2"); }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" type="image/svg+xml" href="logos/heart-terra.svg" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/editor.css" />
    <link rel="stylesheet" href="OneLoaf.Web.styles.css" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="app-boot" role="status">
            <span class="app-boot__brand">OneLoaf</span>
            <span class="ol-visually-hidden">Loading the application</span>
        </div>
    </div>

    <div id="blazor-error-ui" class="app-fatal" role="alert">
        <p class="app-fatal__text">Something went wrong. Reload the page to continue.</p>
        <a class="ol-btn ol-btn--secondary" href="">Reload</a>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
