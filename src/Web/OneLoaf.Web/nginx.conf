# Static hosting of the OneLoaf web client (Blazor WebAssembly) behind Caddy. Caddy terminates TLS, adds the security
# headers and routes /core, /assistant and /notify to the services; everything else reaches this server.
server {
    # Non-root nginx (nginx-unprivileged image) cannot bind to ports below 1024.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # Types the default mime.types lacks or gets wrong for .NET WebAssembly.
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
        application/octet-stream dat dll pdb blat;
        application/manifest+json webmanifest;
    }

    # The publish output contains precompressed .gz files next to every asset.
    gzip_static on;

    # Fingerprinted runtime and assemblies: the name changes with the content, so cache forever.
    location /_framework/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The entry page and the service worker must always be revalidated, or users keep an old version.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /service-worker.js {
        add_header Cache-Control "no-cache";
    }

    # Everything else (css, js/device.js, icons, appsettings.json): revalidate with the ETag.
    location / {
        add_header Cache-Control "no-cache";
        # SPA fallback: client-side routes such as /recipes/42 are served by index.html.
        try_files $uri $uri/ /index.html;
    }
}
