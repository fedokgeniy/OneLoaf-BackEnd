apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # Correlation id in a log line links to all lines of the same operation across the services.
      derivedFields:
        - name: CorrelationId
          matcherRegex: '"CorrelationId":"([^"]+)"'
          url: '{service=~".+"} |= "$${__value.raw}"'
          datasourceUid: loki
