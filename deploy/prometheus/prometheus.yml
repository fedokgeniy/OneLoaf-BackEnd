global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: core-api
    static_configs: [{ targets: ["core-api:8080"] }]

  - job_name: assistant
    static_configs: [{ targets: ["assistant:8080"] }]

  - job_name: notification
    static_configs: [{ targets: ["notification:8080"] }]

  # RabbitMQ built-in Prometheus plugin; per-queue metrics for the dead-letter alert.
  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs: [{ targets: ["rabbitmq:15692"] }]

  - job_name: postgres
    static_configs: [{ targets: ["postgres-exporter:9187"] }]

  - job_name: node
    static_configs: [{ targets: ["node-exporter:9100"] }]
