# Production stack on one VM. Images come from GitHub Container Registry; every secret comes from the server's .env
# (written by the deploy job from GitHub Environment secrets, see .env.example). Only Caddy publishes ports.
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml run --rm migrator
#   docker compose -f docker-compose.prod.yml up -d

name: oneloaf

x-service: &service
  restart: unless-stopped
  networks: [backend]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-dotnet-env: &dotnet-env
  ASPNETCORE_ENVIRONMENT: Production
  ConnectionStrings__OneLoaf: "Host=db;Port=5432;Database=${ONELOAF_DB:-oneloaf};Username=oneloaf_app;Password=${ONELOAF_APP_PASSWORD}"
  Jwt__Issuer: ${Jwt__Issuer}
  Jwt__Audience: ${Jwt__Audience}
  Jwt__PublicKeyPem: ${Jwt__PublicKeyPem}
  RabbitMq__Host: rabbitmq
  RabbitMq__UserName: ${RABBITMQ_DEFAULT_USER:-oneloaf}
  RabbitMq__Password: ${RABBITMQ_DEFAULT_PASS}
  Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD}"
  Loki__Url: http://loki:3100
  Serilog__MinimumLevel__Default: ${Serilog__MinimumLevel__Default:-Information}
  Cors__AllowedOrigins: ${Cors__AllowedOrigins}

services:
  caddy:
    <<: *service
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      GRAFANA_BASIC_AUTH_HASH: ${GRAFANA_BASIC_AUTH_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [core-api, assistant, notification, grafana]

  db:
    <<: *service
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      ONELOAF_DB: ${ONELOAF_DB:-oneloaf}
      ONELOAF_ADMIN_PASSWORD: ${ONELOAF_ADMIN_PASSWORD:?Set ONELOAF_ADMIN_PASSWORD}
      ONELOAF_APP_PASSWORD: ${ONELOAF_APP_PASSWORD:?Set ONELOAF_APP_PASSWORD}
      ONELOAF_READER_PASSWORD: ${ONELOAF_READER_PASSWORD:?Set ONELOAF_READER_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/security/bootstrap.sql:/oneloaf/bootstrap.sql:ro
      - ./db/security/docker-init.sh:/docker-entrypoint-initdb.d/10-oneloaf-bootstrap.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d ${ONELOAF_DB:-oneloaf}"]
      interval: 10s
      timeout: 3s
      retries: 10

  migrator:
    image: ghcr.io/${GHCR_OWNER}/oneloaf-migrator:${IMAGE_TAG:-latest}
    networks: [backend]
    environment:
      ConnectionStrings__OneLoaf: "Host=db;Port=5432;Database=${ONELOAF_DB:-oneloaf};Username=app_admin;Password=${ONELOAF_ADMIN_PASSWORD}"
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
    profiles: [migrate]

  rabbitmq:
    <<: *service
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-oneloaf}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS}
    command: >
      sh -c "rabbitmq-plugins enable --offline rabbitmq_prometheus && exec docker-entrypoint.sh rabbitmq-server"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 10

  redis:
    <<: *service
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 15s
      timeout: 3s
      retries: 10

  core-api:
    <<: *service
    image: ghcr.io/${GHCR_OWNER}/oneloaf-core-api:${IMAGE_TAG:-latest}
    environment:
      <<: *dotnet-env
      Jwt__SigningKeyPem: ${Jwt__SigningKeyPem}
      Jwt__AccessTokenMinutes: ${Jwt__AccessTokenMinutes:-60}
    depends_on:
      db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }

  assistant:
    <<: *service
    image: ghcr.io/${GHCR_OWNER}/oneloaf-assistant:${IMAGE_TAG:-latest}
    environment:
      <<: *dotnet-env
      Anthropic__ApiKey: ${Anthropic__ApiKey}
      Anthropic__Model: ${Anthropic__Model:-claude-haiku-4-5}
      Assistant__CoreApiBaseUrl: http://core-api:8080
      Assistant__DailyRequestLimit: ${Assistant__DailyRequestLimit:-50}
      Assistant__DailyTokenLimit: ${Assistant__DailyTokenLimit:-200000}
      Assistant__MonthlyBudgetUsd: ${Assistant__MonthlyBudgetUsd:-4.5}
    depends_on:
      redis: { condition: service_healthy }
      core-api: { condition: service_started }

  notification:
    <<: *service
    image: ghcr.io/${GHCR_OWNER}/oneloaf-notification:${IMAGE_TAG:-latest}
    environment:
      <<: *dotnet-env
      Notification__VapidSubject: ${Notification__VapidSubject}
      Notification__VapidPublicKey: ${Notification__VapidPublicKey}
      Notification__VapidPrivateKey: ${Notification__VapidPrivateKey}
      Smtp__Host: ${Smtp__Host:-}
      Smtp__Port: ${Smtp__Port:-587}
      Smtp__User: ${Smtp__User:-}
      Smtp__Password: ${Smtp__Password:-}
      Smtp__From: ${Smtp__From:-}
    depends_on:
      db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }

  prometheus:
    <<: *service
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheusdata:/prometheus

  alertmanager:
    <<: *service
    image: prom/alertmanager:v0.28.1
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    # Alertmanager does not expand environment variables, so the secrets are substituted at start.
    entrypoint:
      - /bin/sh
      - -c
      - >
        sed -e "s|__TELEGRAM_BOT_TOKEN__|$$TELEGRAM_BOT_TOKEN|" -e "s|__TELEGRAM_CHAT_ID__|$$TELEGRAM_CHAT_ID|"
        /etc/alertmanager/alertmanager.yml > /tmp/alertmanager.yml &&
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  loki:
    <<: *service
    image: grafana/loki:3.5.3
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - lokidata:/loki

  grafana:
    <<: *service
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://${DOMAIN}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana

  postgres-exporter:
    <<: *service
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: "postgresql://oneloaf_reader:${ONELOAF_READER_PASSWORD}@db:5432/${ONELOAF_DB:-oneloaf}?sslmode=disable"

  node-exporter:
    <<: *service
    image: prom/node-exporter:v1.9.1
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro,rslave

  db-backup:
    <<: *service
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${ONELOAF_ADMIN_PASSWORD}
      ONELOAF_DB: ${ONELOAF_DB:-oneloaf}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    # Daily custom-format dump; dumps older than BACKUP_KEEP_DAYS are removed.
    entrypoint:
      - /bin/sh
      - -c
      - >
        while true; do
        pg_dump -h db -U app_admin -d "$$ONELOAF_DB" -Fc -f "/backups/oneloaf-$$(date +%Y%m%d-%H%M).dump" &&
        find /backups -name 'oneloaf-*.dump' -mtime +$$BACKUP_KEEP_DAYS -delete;
        sleep 86400;
        done
    volumes:
      - ./backups:/backups
    depends_on:
      db: { condition: service_healthy }

networks:
  backend:

volumes:
  pgdata:
  rabbitmqdata:
  redisdata:
  prometheusdata:
  lokidata:
  grafanadata:
  caddy-data:
  caddy-config:
