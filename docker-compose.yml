# Local environment: PostgreSQL 16 with the OneLoaf roles, the migrator, RabbitMQ, Redis and the Core API.
# All passwords and keys come from .env (see .env.example); nothing secret is stored in this file.
#
#   cp .env.example .env              # fill in the passwords and the JWT keys
#   docker compose up -d db           # first start runs db/security/bootstrap.sql (roles + database)
#   docker compose run --rm migrator  # applies the migrations as app_admin
#   docker compose up -d --build      # everything; the Core API starts after the migrator has finished

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      ONELOAF_DB: ${ONELOAF_DB:-oneloaf}
      ONELOAF_ADMIN_PASSWORD: ${ONELOAF_ADMIN_PASSWORD:?Set ONELOAF_ADMIN_PASSWORD in .env}
      ONELOAF_APP_PASSWORD: ${ONELOAF_APP_PASSWORD:?Set ONELOAF_APP_PASSWORD in .env}
      ONELOAF_READER_PASSWORD: ${ONELOAF_READER_PASSWORD:?Set ONELOAF_READER_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/security/bootstrap.sql:/oneloaf/bootstrap.sql:ro
      - ./db/security/docker-init.sh:/docker-entrypoint-initdb.d/10-oneloaf-bootstrap.sh:ro
      - ./db:/oneloaf/db:ro
    healthcheck:
      # TCP check: during initialization the server listens only on the local socket,
      # so the container becomes healthy only after bootstrap.sql has created the database
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d ${ONELOAF_DB:-oneloaf}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrator:
    build:
      context: .
      dockerfile: src/OneLoaf.DbMigrator/Dockerfile
    image: oneloaf-migrator:local
    environment:
      ConnectionStrings__OneLoaf: "Host=db;Port=5432;Database=${ONELOAF_DB:-oneloaf};Username=app_admin;Password=${ONELOAF_ADMIN_PASSWORD}"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-oneloaf}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  core-api:
    build:
      context: .
      dockerfile: src/Services/CoreApi/OneLoaf.CoreApi/Dockerfile
    image: oneloaf-core-api:local
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__OneLoaf: "Host=db;Port=5432;Database=${ONELOAF_DB:-oneloaf};Username=oneloaf_app;Password=${ONELOAF_APP_PASSWORD}"
      Jwt__Issuer: ${Jwt__Issuer:?Set Jwt__Issuer in .env}
      Jwt__Audience: ${Jwt__Audience:?Set Jwt__Audience in .env}
      Jwt__AccessTokenMinutes: ${Jwt__AccessTokenMinutes:-60}
      Jwt__SigningKeyPem: ${Jwt__SigningKeyPem:?Set Jwt__SigningKeyPem in .env}
      Jwt__PublicKeyPem: ${Jwt__PublicKeyPem:?Set Jwt__PublicKeyPem in .env}
      Serilog__MinimumLevel__Default: ${Serilog__MinimumLevel__Default:-Information}
    ports:
      - "${CORE_API_PORT:-5080}:8080"
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

volumes:
  pgdata:
  rabbitmqdata:
  redisdata:
